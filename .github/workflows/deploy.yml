name: Deploy

on:
  push:
    branches: [develop]

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 103942587236.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 및 푸시
        run: |
          docker build -t $ECR_REGISTRY/lawbee-api:latest .
          docker tag  $ECR_REGISTRY/lawbee-api:latest $ECR_REGISTRY/lawbee-ui:latest
          docker push $ECR_REGISTRY/lawbee-api:latest
          docker push $ECR_REGISTRY/lawbee-ui:latest

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin \
                103942587236.dkr.ecr.ap-southeast-2.amazonaws.com
            cd ~/LawBee
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
            docker image prune -f
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
