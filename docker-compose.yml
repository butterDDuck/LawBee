services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 런타임 데이터(DB)는 마운트된 디렉토리에 보관
      - DB_PATH=var/lawbee.db
    volumes:
      # 벡터스토어·런타임 데이터는 호스트에 영속화 (재시작 시 유지)
      - ./vectorstore:/app/vectorstore
      - ./var:/app/var
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # 컨테이너 네트워크 내에서 api 서비스 호출
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
